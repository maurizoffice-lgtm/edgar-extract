[project]
name = "edgar-extract"
version = "0.1.0"
description = "LLM-based extraction of financial metrics from SEC 10-K filings, evaluated against XBRL ground truth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
